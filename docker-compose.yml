# Before running: python scripts/setup_docker.py
# The setup script auto-generates .env with secure credentials.

services:
  backend:
    container_name: nocturne-backend
    build:
      context: ./backend
    command: python run_sse.py
    environment:
      SNAPSHOT_DIR: /app/snapshots
    volumes:
      - ./data/sqlite:/app/sqlite
      - ./data/snapshots:/app/snapshots
      - ./data/backups:/app/backups
      - ./config.docker.json:/app/config.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8233/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    container_name: nocturne-nginx
    build:
      context: ./frontend
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped